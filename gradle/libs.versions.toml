# Versiones de todas las herramientas y librerías del proyecto, en un solo sitio.
[versions]
agp = "9.4.1"
kotlin = "2.4.21"
coreKtx = "1.19.1"
appcompat = "1.8.0"
activityCompose = "1.13.0"
fragment = "1.9.1"
composeBom = "2026.11.01"
readium = "3.4.0"
media3 = "1.11.0"
desugar = "2.1.5"
ksp = "2.3.14"
room = "2.8.5"
lifecycle = "2.11.1"
documentfile = "1.1.0"
navigation = "2.10.2"
pdfbox = "2.0.27.0"
junit = "4.13.2"
junrar = "7.5.5"
glance = "1.2.0"
work = "2.10.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
readium-shared = { group = "org.readium.kotlin-toolkit", name = "readium-shared", version.ref = "readium" }
readium-streamer = { group = "org.readium.kotlin-toolkit", name = "readium-streamer", version.ref = "readium" }
readium-navigator = { group = "org.readium.kotlin-toolkit", name = "readium-navigator", version.ref = "readium" }
readium-navigator-media-tts = { group = "org.readium.kotlin-toolkit", name = "readium-navigator-media-tts", version.ref = "readium" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
readium-pdfium-document = { group = "org.readium.kotlin-toolkit", name = "readium-adapter-pdfium-document", version.ref = "readium" }
readium-pdfium-navigator = { group = "org.readium.kotlin-toolkit", name = "readium-adapter-pdfium-navigator", version.ref = "readium" }

# Sacar el texto de los PDF (modo texto). Licencia Apache 2.0.
pdfbox-android = { group = "com.tom-roush", name = "pdfbox-android", version.ref = "pdfbox" }

# Abrir los cómics CBR (RAR 4 y anteriores). Gratuita; licencia UnRAR (no es libre:
# permite descomprimir, prohíbe usarla para crear un compresor RAR).
junrar = { group = "com.github.junrar", name = "junrar", version.ref = "junrar" }

# Widgets de la pantalla de inicio (racha de lectura y «Seguir leyendo»). Licencia Apache 2.0.
androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

# Solo para las pruebas en el ordenador (no va dentro de la app).
junit = { group = "junit", name = "junit", version.ref = "junit" }

desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugar" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
